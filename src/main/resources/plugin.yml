name: GeoCountries
version: 'ALPHA-0.044'
main: me.rntb.geoCountries.GeoCountries
api-version: '1.21'
authors: [ rNTB ]
description: Countries, geopolitics, and more!

commands:
  gc:
    description: "The base command for GeoCountries. To see all commands, do /gc help"
    usage: "/gc"
    aliases: [ geocountries ]

permissions:
  # -------------------- ALL --------------------
  gc.*:
    description: Gives every single permission.
    children:
      gc.group.admin: true
      gc.group.player: true
      gc.group.essential: true

  # -------------------- ESSENTIAL --------------------
  gc.group.essential:
    description: Gives all the essential permissions.
    children:
      gc: true
      gc.help: true
      gc.country: true
      gc.country.list: true
      gc.country.info: true
      gc.country.citizens: true
      gc.player: true
      gc.player.info: true
      gc.gui: true
      gc.claim.info: true

  # -------------------- PLAYER -------------------
  gc.group.player:
    description: Gives all the player permissions.
    children:
      gc.group.essential: true
      # all essential permissions, plus...
      gc.confirm: true
      gc.cancel: true
      gc.country.create: true
      gc.country.rename: true
      gc.country.dissolve: true
      gc.country.settings: true
      gc.citizenship: true
      gc.citizenship.apply: true
      gc.citizenship.sent: true
      gc.citizenship.unsend: true
      gc.citizenship.renounce: true
      gc.citizenship.received: true
      gc.citizenship.accept: true
      gc.citizenship.reject: true
      gc.citizenship.revoke: true
      gc.player.settings: true
      gc.claim: true
      gc.claim.one: true
      gc.claim.map: true
      gc.claim.reloadmap: true
      gc.unclaim: true
      gc.unclaim.one: true

  # -------------------- ADMIN --------------------
  gc.group.admin:
    description: Gives all admin permissions.
    children:
      gc.group.player: true
      # all essential and player permissions, plus...
      gc.purge: true
      gc.dump: true
      gc.save: true
      gc.config: true
      gc.debug: true
      gc.admin: true
      gc.load: true